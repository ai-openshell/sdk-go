# Go SDK tasks. Run `mise tasks` to list them and `mise run ci` for the full
# pipeline. Bindings are generated from core's proto/ at the release tag
# pinned in buf.gen.yaml (inputs[0].tag), so no core checkout is needed.

min_version = { soft = "2026.9.9" }

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[tools]
go = "1.25.14"
buf = "1.72.0"
yq = "4.53.6"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.12"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.11"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "1.6.2"
"go:golang.org/x/tools/cmd/goimports" = "0.48.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.32.0"
mdbook = "0.5.4"

[tasks.test]
description = "Run unit tests with coverage"
run = "go test -coverprofile=coverage.out -coverpkg=./openshell/... -race ./..."

[tasks."test:integration"]
description = "Run integration tests"
run = "go test -tags=integration -race ./..."

[tasks.lint]
description = "Run linter"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Format code"
run = "goimports -w . && go fmt ./..."

[tasks."format:check"]
description = "Verify code is gofmt-formatted"
run = """
#!/usr/bin/env bash
set -euo pipefail
UNFORMATTED=$(gofmt -l . 2>/dev/null || true)
if [ -n "$UNFORMATTED" ]; then
  echo "ERROR: The following files are not gofmt-formatted:"
  echo "$UNFORMATTED"
  exit 1
fi
"""

[tasks.build]
description = "Build all packages"
run = "go build ./..."

[tasks.ci]
description = "Run full CI pipeline"
depends = ["format:check", "lint", "build", "test", "proto:check", "conformance:check", "docs:check"]

[tasks."core:version"]
description = "Print the core release tag the bindings are pinned to"
run = "yq -r '.inputs[0].tag' buf.gen.yaml"

[tasks."conformance:check"]
description = "Verify vendored conformance fixtures match core at the pinned tag"
run = """
#!/usr/bin/env bash
set -euo pipefail

# Shared cross-SDK fixtures live in core's sdk/conformance/. A copy sits next
# to the tests that read it, and must match core at the pinned tag.
TAG=$(yq -r '.inputs[0].tag' buf.gen.yaml)
BASE="https://raw.githubusercontent.com/NVIDIA/OpenShell/$TAG/sdk/conformance"
FAILED=0
TMP=$(mktemp)
trap 'rm -f "$TMP"' EXIT

for local in $(grep -v '^#' hack/conformance-fixtures.txt); do
  name=$(basename "$local")
  status=$(curl -sS -o "$TMP" -w '%{http_code}' "$BASE/$name")
  if [ "$status" = 404 ]; then
    # Vendored from core main before the pinned tag had it; enforced from
    # the first pin that contains the file.
    echo "WARNING: core $TAG has no sdk/conformance/$name yet, skipping $local"
    continue
  fi
  if [ "$status" != 200 ]; then
    echo "ERROR: fetching $BASE/$name returned HTTP $status"
    FAILED=1
    continue
  fi
  if ! diff -u "$TMP" "$local"; then
    echo "ERROR: $local differs from core $TAG sdk/conformance/$name"
    FAILED=1
  fi
done

if [ "$FAILED" -ne 0 ]; then
  echo "Copy the fixture from core at $TAG and adjust the tests."
  exit 1
fi

echo "Conformance check passed: fixtures match core $TAG."
"""

[tasks."docs:check"]
description = "Verify every public package has a docs page"
run = """
#!/usr/bin/env bash
set -euo pipefail

DOCS_DIR="docs/src/api"
SUMMARY="docs/src/SUMMARY.md"
MISSING=0

# Find all public packages with a doc.go (excluding internal, proto, types)
for docfile in openshell/v1/*/doc.go; do
  pkg=$(basename "$(dirname "$docfile")")

  # Skip internal packages and types (no user-facing docs needed)
  case "$pkg" in
    internal|types) continue ;;
  esac

  # Check for matching docs page
  if [ ! -f "$DOCS_DIR/$pkg.md" ]; then
    echo "MISSING: $DOCS_DIR/$pkg.md (package openshell/v1/$pkg has doc.go but no docs page)"
    MISSING=$((MISSING + 1))
  fi

  # Check for SUMMARY.md entry
  if ! grep -q "api/$pkg.md" "$SUMMARY" 2>/dev/null; then
    echo "MISSING: SUMMARY.md entry for api/$pkg.md"
    MISSING=$((MISSING + 1))
  fi
done

if [ "$MISSING" -gt 0 ]; then
  echo ""
  echo "ERROR: $MISSING documentation gaps found."
  echo "Every public package with doc.go needs a docs/src/api/<pkg>.md page"
  echo "and a SUMMARY.md entry."
  exit 1
fi

echo "Docs check passed: all public packages have documentation."
"""

[tasks."proto:gen"]
description = "Generate Go bindings from core's proto files at the pinned tag"
run = """
#!/usr/bin/env bash
set -euo pipefail

for tool in buf protoc-gen-go protoc-gen-go-grpc; do
  if ! command -v "$tool" &>/dev/null; then
    echo "ERROR: $tool not found. Run 'mise install' to install it."
    exit 1
  fi
done

if find proto -name '*.proto' -print -quit | grep -q .; then
  echo "ERROR: proto/ must contain generated bindings only."
  echo "Proto sources come from NVIDIA/OpenShell at the tag in buf.gen.yaml."
  exit 1
fi

# Clean previous output before regeneration
find proto -name '*.pb.go' -delete 2>/dev/null || true
find proto -mindepth 1 -type d -empty -delete 2>/dev/null || true

buf generate --template buf.gen.yaml

echo "Proto generation complete (core $(yq -r '.inputs[0].tag' buf.gen.yaml))."
echo "Generated packages:"
for pkg_dir in proto/*/; do
  count=$(find "$pkg_dir" -maxdepth 1 -name '*.go' | wc -l | tr -d ' ')
  echo "  $pkg_dir: $count files"
done
"""

[tasks."proto:check"]
description = "Verify generated proto files match the pinned core tag"
run = """
#!/usr/bin/env bash
set -euo pipefail

for tool in buf protoc-gen-go protoc-gen-go-grpc; do
  if ! command -v "$tool" &>/dev/null; then
    echo "ERROR: $tool not found. Run 'mise install' to install it."
    exit 1
  fi
done

if find proto -name '*.proto' -print -quit | grep -q .; then
  echo "ERROR: proto/ contains copied proto sources."
  echo "Proto sources come from NVIDIA/OpenShell at the tag in buf.gen.yaml."
  exit 1
fi

WORK_DIR=$(mktemp -d)
trap 'rm -rf "$WORK_DIR"' EXIT

# Generate into a temp directory with the output path rewritten
sed 's|out: \\.$|out: '"$WORK_DIR"'|' buf.gen.yaml > "$WORK_DIR/buf.gen.yaml"
if ! grep -q "out: $WORK_DIR" "$WORK_DIR/buf.gen.yaml"; then
  echo "ERROR: could not rewrite the plugin output path in buf.gen.yaml."
  exit 1
fi
buf generate --template "$WORK_DIR/buf.gen.yaml"

DIFF_OUTPUT=$(diff -r "$WORK_DIR/proto" proto 2>&1) || true

if [ -n "$DIFF_OUTPUT" ]; then
  echo "ERROR: Generated proto files are out of date."
  echo "Run 'mise run proto:gen' to regenerate."
  echo ""
  echo "$DIFF_OUTPUT"
  exit 1
fi

echo "Proto check passed: generated files match core $(yq -r '.inputs[0].tag' buf.gen.yaml)."
"""

[tasks."workflows:check"]
description = "Lint GitHub workflows with actionlint (with shellcheck) and zizmor"
run = [
  "actionlint",
  "zizmor --offline --min-severity medium .github",
]

[tasks."docs:build"]
description = "Build the mdbook docs into docs/book"
run = "mdbook build docs"

[tasks."core:tags"]
description = "List core release tags newer than the pin (newest pre-release only, --all for every tag)"
run = "hack/automation/core-tags.sh"

[tasks."core:bump"]
description = "Open the update proposal for a core tag: mise run core:bump -- <tag> [--dry-run]"
run = "hack/automation/open-bump-pr.sh"

[tasks."release:tag"]
description = "Tag the lockstep SDK release for a stable pin (--dry-run prints what it would do)"
run = "hack/automation/tag-release.sh"
