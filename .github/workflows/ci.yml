name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check license headers
        uses: ai-openshell/workflows/spdx-check@0b051efd25c3f7319634fed863d2e03e1bd55d7b
        with:
          include: >-
            *.go *.sh *.toml *.yml *.yaml *.json
            Dockerfile* */Dockerfile*
          exclude: proto/*

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false

      - name: Install tools
        run: mise install --locked

      # buf fetches proto/ from ai-openshell/openshell at the pinned tag (public, no credentials).
      - name: Run CI pipeline
        run: mise run ci

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false

      - name: Install tools
        run: mise install --locked actionlint shellcheck zizmor

      - name: Lint workflows
        run: mise run workflows:check

  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed_paths=$(git diff --name-only "${BASE_SHA}...HEAD")
          if grep -qE '^(buf\.gen\.yaml$|go\.(mod|sum)$|mise\.toml$|proto/|openshell/|e2e/|hack/automation/(start|stop)-gateway\.sh$|\.github/workflows/e2e\.yml$)' <<<"$changed_paths"; then
            echo "e2e=true" >>"$GITHUB_OUTPUT"
          else
            echo "e2e=false" >>"$GITHUB_OUTPUT"
          fi

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml

  e2e-gate:
    name: e2e-gate
    needs: [changes, e2e]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check E2E result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_REQUIRED: ${{ needs.changes.outputs.e2e }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          case "$CHANGES_RESULT:$E2E_REQUIRED:$E2E_RESULT" in
            success:true:success | success:false:skipped) exit 0 ;;
          esac
          echo "E2E gate failed (changes=$CHANGES_RESULT, required=$E2E_REQUIRED, e2e=$E2E_RESULT)." >&2
          exit 1
