# Opens one update proposal per new core release tag and reconciles the RPC
# coverage issues against the newest core tag; when auto-merge is on, a
# separate job merges stable proposals that change no proto
# (hack/automation/).
name: core-watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Core tag to propose (vX.Y.Z or vX.Y.Z-pre.N); empty proposes every new tag
        required: false
        default: ""
      max_new_issues:
        description: Limit for new RPC coverage issues in this run (default 10)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: core-watch
  cancel-in-progress: false

jobs:
  watch:
    name: watch
    # The bot secrets live in the sdk-bot environment, which only main can
    # deploy to, so a pushed branch can't mint a bot token.
    environment: sdk-bot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: ${{ vars.CORE_AUTO_MERGE == 'on' && 'write' || '' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false

      - name: Install tools
        run: mise install --locked

      - name: Set the bot identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Propose new core tags
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_TAG: ${{ inputs.tag }}
          CORE_AUTO_MERGE: ${{ vars.CORE_AUTO_MERGE }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tags=$INPUT_TAG
          else
            tags=$(hack/automation/core-tags.sh)
          fi
          if [ -z "$tags" ]; then
            echo "No core tags newer than $(mise run --quiet core:version)."
            exit 0
          fi
          for t in $tags; do
            hack/automation/open-bump-pr.sh "$t"
          done

      # Runs after a failed proposal step too, so issues can say that the
      # proposal is pending; it needs only the bot token.
      - name: Reconcile RPC coverage issues
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          MAX_NEW: ${{ inputs.max_new_issues }}
        run: BOT_LOGIN="${APP_SLUG}[bot]" hack/automation/rpc-issues.sh ${MAX_NEW:+--max-new "$MAX_NEW"}

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: hack/automation/report-failure.sh core-watch "$RUN_URL"

  # Merges stable proposals that change no proto and whose checks went green
  # (hack/automation/merge-bump-pr.sh). Only when the CORE_AUTO_MERGE
  # repository variable is on. A separate job with a separate App: only the
  # merge App is a bypass actor on main-integrity, the bump App that pushes
  # core/* branches is not, and this job runs no generator or other code
  # from core.
  merge:
    name: merge
    needs: watch
    if: ${{ !cancelled() && vars.CORE_AUTO_MERGE == 'on' }}
    environment: sdk-bot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.SDK_MERGE_CLIENT_ID }}
          private-key: ${{ secrets.SDK_MERGE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false

      - name: Install tools
        run: mise install --locked yq

      - name: Merge proposals that change no proto
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORE_AUTO_MERGE: ${{ vars.CORE_AUTO_MERGE }}
        run: hack/automation/merge-bump-pr.sh

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: hack/automation/report-failure.sh core-watch-merge "$RUN_URL"
