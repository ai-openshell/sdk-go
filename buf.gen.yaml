# Code generation for the Go SDK. buf fetches core's proto/ directory at the
# pinned release tag and runs protoc-gen-go / protoc-gen-go-grpc from
# mise-managed binaries. inputs[0].tag is the single core pin: the core-watch
# automation changes only that line, and `mise run core:version` prints it.
# Imported schemas are included automatically, so their dependency closure is
# generated without listing every file.
version: v2
inputs:
  - git_repo: https://github.com/NVIDIA/OpenShell.git
    tag: v0.1.8
    depth: 1
    subdir: proto
    paths:
      - openshell.proto
plugins:
  - local: protoc-gen-go
    out: .
    include_imports: true
    opt:
      - module=github.com/ai-openshell/sdk-go
      - Mopenshell.proto=github.com/ai-openshell/sdk-go/proto/openshellv1
      - Mdatamodel.proto=github.com/ai-openshell/sdk-go/proto/datamodelv1
      - Msandbox.proto=github.com/ai-openshell/sdk-go/proto/sandboxv1
      - Moptions.proto=github.com/ai-openshell/sdk-go/proto/optionsv1
  - local: protoc-gen-go-grpc
    out: .
    include_imports: true
    opt:
      - module=github.com/ai-openshell/sdk-go
      - Mopenshell.proto=github.com/ai-openshell/sdk-go/proto/openshellv1
      - Mdatamodel.proto=github.com/ai-openshell/sdk-go/proto/datamodelv1
      - Msandbox.proto=github.com/ai-openshell/sdk-go/proto/sandboxv1
      - Moptions.proto=github.com/ai-openshell/sdk-go/proto/optionsv1
